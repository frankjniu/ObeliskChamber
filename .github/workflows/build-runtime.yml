# Builds the runtime as fefw_rt.dll (+ fefw_rt.lib and the ASTC decoder DLLs), as game-build/scripts/make-release.ps1 expects it,
# on GitHub's Windows runners. Download the "fefw_rt" artifact of a run and put fefw_rt.dll (and astcdec-*.dll) next to ObeliskChamber.exe and
# fefw_rt.lib into tools\build\sdk\ of an installed release, then run Set up (the new runtime makes it link ObeliskChamber.exe again).
name: Build fefw_rt

on:
  push:
    branches: ['claude/**', 'master']
  pull_request:
  workflow_dispatch:

jobs:
  fefw_rt:
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v6

      - name: LLVM 23 or newer (clang-cl)
        shell: pwsh
        run: |
          # The runner's Visual Studio STL (MSVC 14.52) stops with STL1000 under clang older than 22. Chocolatey's feed has failed
          # here while still reporting "upgraded 1/1", so the installer comes from LLVM's own GitHub release, and the step fails
          # when the clang-cl it leaves is still too old instead of the build failing two steps later.
          $cl = 'C:\Program Files\LLVM\bin\clang-cl.exe'
          $want = '23.1.3'
          function Major { if ((Test-Path $cl) -and ((& $cl --version | Select-Object -First 1) -match 'version (\d+)')) { [int]$Matches[1] } else { 0 } }
          $v = Major
          Write-Output "installed clang-cl major version: $v"
          if ($v -lt 23) {
            # LLVM 23's Windows installer is an .msi (22 and older shipped an NSIS .exe)
            $msi = Join-Path $env:RUNNER_TEMP "LLVM-$want-win64.msi"
            Invoke-WebRequest -Uri "https://github.com/llvm/llvm-project/releases/download/llvmorg-$want/LLVM-$want-win64.msi" -OutFile $msi
            $p = Start-Process -FilePath msiexec.exe -ArgumentList "/i `"$msi`" /qn /norestart" -Wait -PassThru
            Write-Output "msiexec exit code: $($p.ExitCode)"
            $v = Major
          }
          & $cl --version
          if ($v -lt 22) { Write-Output "::error::clang-cl $v is installed; the Visual Studio STL needs clang 22 or newer (LLVM $want was not installed)"; exit 1 }
          if ($v -lt 23) { Write-Output "::warning::clang-cl is older than the LLVM 23 docs/BUILDING.md asks for" }

      - name: Ninja
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { choco install ninja -y --no-progress }
          ninja --version

      - name: NASM (the movie decoder's assembly)
        shell: pwsh
        run: |
          if (-not (Get-Command nasm -ErrorAction SilentlyContinue)) {
            choco install nasm -y --no-progress
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            Add-Content -Path $env:GITHUB_PATH -Value 'C:\Program Files\NASM'
            $env:PATH = "C:\Program Files\NASM;$env:PATH"
          }
          nasm -v

      - name: Texture transcoder (third-party sources, ISPC build)
        shell: pwsh
        run: |
          pwsh -File tools/textures/scripts/fetch_third_party.ps1
          pwsh -File tools/textures/scripts/build.ps1 -Ispc -Jobs 4

      - name: fefw_rt.dll
        shell: pwsh
        run: pwsh -File game-build/scripts/build_fefw.ps1 -Target fefw_rt -BuildDir build/rtdll -CMakeArgs "-DFEFW_RT_DLL=ON -DNXRT_DAV1D_ASM=ON" -Jobs 4

      - name: PGO check (profile_flush writes the counters; the stub links without the profile runtime)
        shell: cmd
        run: |
          call runtime\scripts\env.cmd
          mkdir pgo-check && cd pgo-check
          clang-cl /nologo /O1 /EHsc /std:c++20 -I..\runtime\include -fprofile-instr-generate ..\.github\pgo-check\pgo_check.cpp ..\runtime\src\core\pgo.cpp /Fe:instr.exe /link /LIBPATH:"%NX_LLVM_BIN%\..\lib\clang\23\lib\windows" /LIBPATH:"%NX_LLVM_BIN%\..\lib\clang\23\lib\x86_64-pc-windows-msvc" || exit /b 1
          set LLVM_PROFILE_FILE=%CD%\check-%%p.profraw
          instr.exe || exit /b 1
          dir *.profraw || exit /b 1
          "%NX_LLVM_BIN%\llvm-profdata.exe" merge -o check.profdata check-*.profraw || exit /b 1
          "%NX_LLVM_BIN%\llvm-profdata.exe" show --function=hot --counts check.profdata || exit /b 1
          clang-cl /nologo /O1 /EHsc /std:c++20 -I..\runtime\include ..\.github\pgo-check\pgo_check.cpp ..\runtime\src\core\pgo.cpp /Fe:plain.exe || exit /b 1
          plain.exe || exit /b 1
          clang-cl /nologo /O1 /EHsc /std:c++20 -I..\runtime\include -fprofile-instr-use=check.profdata ..\.github\pgo-check\pgo_check.cpp ..\runtime\src\core\pgo.cpp /Fe:use.exe || exit /b 1

      - name: ThinLTO check (bitcode in an llvm-lib archive, PGO profile applied, lld-link LTO link with a cache)
        shell: cmd
        run: |
          call runtime\scripts\env.cmd
          cd pgo-check
          clang-cl /nologo /c /O2 /EHsc /std:c++20 -I..\runtime\include -flto=thin -fprofile-instr-use=check.profdata /clang:-march=native ..\.github\pgo-check\pgo_check.cpp /Fo:lto_main.obj || exit /b 1
          clang-cl /nologo /c /O1 /EHsc /std:c++20 -I..\runtime\include ..\runtime\src\core\pgo.cpp /Fo:lto_pgo.obj || exit /b 1
          "%NX_LLVM_BIN%\llvm-lib.exe" /nologo /out:lto_game.lib lto_main.obj || exit /b 1
          "%NX_LLVM_BIN%\lld-link.exe" /nologo /out:lto.exe /subsystem:console lto_game.lib lto_pgo.obj /include:main /lldltocache:lto-cache /opt:lldltojobs=2 /defaultlib:libcmt /defaultlib:oldnames /defaultlib:kernel32 || exit /b 1
          lto.exe || exit /b 1
          dir lto-cache || exit /b 1

      - uses: actions/upload-artifact@v7
        with:
          name: fefw_rt
          if-no-files-found: error
          path: |
            game-build/fefw/build/rtdll/fefw_rt.dll
            game-build/fefw/build/rtdll/fefw_rt.lib
            game-build/fefw/build/rtdll/astcdec-*.dll
